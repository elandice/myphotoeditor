<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Luma WebGL compositor tests</title>
<script src="../web/editor_blend.js"></script>
<body><pre id="results">Running WebGL tests...</pre>
<script>
(() => {
  const output = document.querySelector('#results');
  const failures = [];
  let assertions = 0;
  function assert(condition, message) {
    assertions += 1;
    if (!condition) failures.push(message);
  }
  const modes = ['normal', 'multiply', 'screen', 'overlay', 'darken', 'lighten', 'difference', 'add'];
  function channel(mode, b, s) {
    switch (mode) {
      case 'multiply': return b * s;
      case 'screen': return 1 - (1 - b) * (1 - s);
      case 'overlay': return b < .5 ? 2 * b * s : 1 - 2 * (1 - b) * (1 - s);
      case 'darken': return Math.min(b, s);
      case 'lighten': return Math.max(b, s);
      case 'difference': return Math.abs(b - s);
      default: return s;
    }
  }
  function reference(background, source, mode, opacity) {
    const result = [];
    for (let p = 0; p < background.length; p += 4) {
      const ab = background[p + 3] / 255;
      const as = source[p + 3] / 255 * opacity;
      const alpha = mode === 'add' ? Math.min(1, ab + as) : as + ab - as * ab;
      for (let c = 0; c < 3; c++) {
        const b = background[p + c] / 255;
        const s = source[p + c] / 255;
        const color = mode === 'add' ? Math.min(1, b * ab + s * as)
          : (1 - as) * ab * b + (1 - ab) * as * s + as * ab * channel(mode, b, s);
        result.push(alpha ? Math.round(Math.max(0, Math.min(1, color / alpha)) * 255) : 0);
      }
      result.push(Math.round(alpha * 255));
    }
    return result;
  }
  function compare(actual, expected, label) {
    assert(actual !== null, label + ' must render');
    if (!actual) return;
    for (let i = 0; i < expected.length; i++) {
      assert(Math.abs(actual[i] - expected[i]) <= 2,
        `${label} channel ${i}: expected ${expected[i]}, received ${actual[i]}`);
    }
  }
  if (!lumaBlend.available()) {
    output.textContent = 'FAIL: WebGL is unavailable. Run in a WebGL-enabled browser.';
    document.body.dataset.result = 'fail';
    return;
  }
  // Non-square dimensions and a different pixel on every row detect Y flips,
  // incorrect viewport dimensions and accidental premultiplication.
  const background = new Uint8Array([
    255, 0, 0, 255, 0, 255, 0, 255,
    0, 0, 255, 128, 200, 100, 50, 80,
    20, 50, 150, 200, 0, 0, 0, 0,
  ]);
  const source = new Uint8Array([
    100, 200, 50, 128, 10, 30, 220, 255,
    220, 100, 20, 160, 100, 200, 250, 70,
    250, 40, 80, 0, 50, 100, 200, 170,
  ]);
  for (const mode of modes) {
    for (const opacity of [0, .25, .6, 1]) {
      const actual = lumaBlend.composite(2, 3, [
        {rgba: background, opacity: 1, blendMode: 'normal'},
        {rgba: source, opacity, blendMode: mode},
      ]);
      compare(actual, reference(background, source, mode, opacity), mode + '/' + opacity);
      const streamed = lumaBlend.begin(2, 3);
      assert(streamed !== null, 'Streaming session must allocate');
      if (streamed) {
        assert(streamed.add({rgba: background, opacity: 1, blendMode: 'normal'}), 'First upload');
        assert(streamed.add({rgba: source, opacity, blendMode: mode}), 'Second upload');
        compare(streamed.finish(), actual, 'Streaming equivalence ' + mode + '/' + opacity);
        assert(streamed.finish() === null, 'Finished session must not read twice');
        assert(!streamed.add({rgba: source, opacity: 1}), 'Finished session must reject uploads');
        streamed.dispose();
      }
    }
  }
  compare(lumaBlend.composite(2, 3, []), new Uint8Array(24), 'Empty document');
  assert(lumaBlend.composite(2, 3, [{rgba: new Uint8Array(4), opacity: 1}]) === null,
    'Mismatched pixel buffers must be rejected');
  assert(lumaBlend.composite(0, 3, []) === null, 'Zero width must be rejected');
  const first = lumaBlend.begin(2, 3), second = lumaBlend.begin(1, 1);
  assert(first !== null && second !== null, 'Interleaved sessions must allocate');
  if (first && second) {
    first.add({rgba: background, opacity: 1, blendMode: 'normal'});
    second.add({rgba: new Uint8Array([10, 20, 30, 255]), opacity: 1, blendMode: 'normal'});
    first.add({rgba: source, opacity: .6, blendMode: 'overlay'});
    compare(second.finish(), [10, 20, 30, 255], 'Interleaved small session');
    compare(first.finish(), reference(background, source, 'overlay', .6), 'Interleaved large session');
  }
  const invalid = lumaBlend.begin(2, 3);
  assert(invalid !== null && !invalid.add({rgba: new Uint8Array(4), opacity: 1}), 'Invalid streaming upload rejected');
  assert(invalid.finish() === null, 'Failed streaming session must not return partial image');
  invalid.dispose();
  output.textContent = failures.length ? 'FAIL\n' + failures.join('\n')
    : `PASS: ${assertions} WebGL pixel assertions across 8 modes, 4 opacities, alpha edges, row order, streaming/interleaved sessions and invalid buffers.`;
  document.body.dataset.result = failures.length ? 'fail' : 'pass';
})();
</script>
</body></html>
